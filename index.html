<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gombe Mock Poll 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- MATAKI NA 0: WELCOME -->
    <section id="step-0" class="active-step">
      <div class="badge">GOMBE STATE</div>
      <h1>Gombe Mock Poll 2026</h1>
      <p>Zaɓen gwaji ne domin tattara ra'ayi. Ba zaɓen INEC na hukuma ba.</p>
      <button id="start-btn" type="button">FARA ZA'BEN GWAJI</button>
    </section>

    <!-- MATAKI NA 1: ZA'BAR WURIN ZA'BE -->
    <section id="step-1" style="display: none;">
      <div class="step-indicator">MATAKI <span>1</span> / 2</div>
      <h2>Zaɓi Wurin Zaɓenka</h2>
      
      <div class="form-group">
        <label>Ƙaramar Hukuma (LGA):</label>
        <select id="lga-select">
          <option value="">-- Zaɓi LGA --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Inguwa (Ward):</label>
        <select id="ward-select" disabled>
          <option value="">-- Fara zaɓar LGA --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Wurin Zaɓe (Polling Unit):</label>
        <select id="pu-select" disabled>
          <option value="">-- Fara zaɓar Ward --</option>
        </select>
      </div>

      <button id="next-to-candidates-btn" type="button">Wuce Zuwa Zaɓen Ɗan Takara &rarr;</button>
    </section>

    <!-- MATAKI NA 2: ZA'BAR ƊAN TAKARA -->
    <section id="step-2" style="display: none;">
      <div class="step-indicator">MATAKI <span>2</span> / 2</div>
      <h2>Zaɓi Ɗan Takarar Gwamna (2027)</h2>
      
      <div class="candidates-list">
        <label class="candidate-card">
          <input type="radio" name="candidate" value="APC - Dr. Jamilu Isyaku Gwamna">
          <div class="card-info">
            <strong>APC</strong>: Dr. Jamilu Isyaku Gwamna
          </div>
        </label>

        <label class="candidate-card">
          <input type="radio" name="candidate" value="PDP - Prof. Isa Ali Ibrahim Pantami">
          <div class="card-info">
            <strong>PDP</strong>: Prof. Isa Ali Ibrahim Pantami
          </div>
        </label>

        <label class="candidate-card">
          <input type="radio" name="candidate" value="ADC - Bala Bello">
          <div class="card-info">
            <strong>ADC</strong>: Bala Bello
          </div>
        </label>
      </div>

      <button id="submit-vote-btn" type="button">Aika Zaɓina (Submit Vote)</button>
    </section>

    <!-- MATAKI NA 3: SAKAMAKO -->
    <section id="step-3" style="display: none;">
      <div class="success-icon">✓</div>
      <h2>An karɓi zaɓen gwajin ka!</h2>
      <p id="summary-text"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
